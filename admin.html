<style>
:root{--bg:#1c130d;--card:#261a12;--ink:#f3e6d6;--muted:#b9a592;--gold:#d9a846;--line:rgba(243,230,214,.14);--red:#e0705f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top)}
.w{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
h1{font-size:22px}h2{font-size:17px;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:72px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px}
button.p{background:var(--gold);color:#2b1805;border-color:var(--gold);font-weight:700}
button.d{border-color:var(--red);color:var(--red)}
button:disabled{opacity:.5}
.pv{width:100%;aspect-ratio:4/3;border-radius:12px;background:#7a4a1e center/cover;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hide{display:none!important}
#toast{position:fixed;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
#inst{background:var(--gold);color:#2b1805;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:14px}
#inst button{background:#2b1805;color:var(--ink);border:0;white-space:nowrap}
</style>
</head>
<body>
<div class="w">
  <header><h1>لوحة تحكم المتجر</h1><button id="out" class="hide">خروج</button></header>
  <div id="inst" class="hide"><span id="instT">ثبّت اللوحة كتطبيق على جهازك</span><button id="instB">تثبيت</button></div>

  <div id="login" class="card hide">
    <h2>تسجيل الدخول</h2>
    <label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" autocapitalize="off">
    <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
    <div class="acts"><button class="p" id="go">دخول</button></div>
  </div>

  <div id="ed" class="hide">
    <p class="sub">كل ما تحفظه هنا يظهر فوراً في موقع الزبائن.</p>
    <div class="card">
      <h2>الإعدادات العامة</h2>
      <label>اسم الموقع</label><input id="title">
      <div class="g2"><div><label>رمز العملة</label><input id="cur"></div><div><label>واتساب الطلبات (دولي بدون +)</label><input id="wa" inputmode="numeric"></div></div>
      <div class="acts"><button class="p" id="sset">حفظ الإعدادات</button></div>
    </div>
    <div id="items"></div>
    <div class="acts"><button class="p" id="add">+ إضافة صنف</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),3200)}

// ===== Firebase =====
let auth,db,col,F;
try{
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  col=db.collection('app_data');F=firebase.firestore.FieldPath.documentId();
}catch(e){}
window.addEventListener('offline',()=>toast('غير متصل: سيُزامن الحفظ عند عودة الإنترنت'));

let S={title:'',cur:'$',wa:''},items=[];

else auth.onAuthStateChanged(u=>{

$('go').onclick=async()=>{const b=$('go');b.disabled=true;

async function load(){
  try{
    const s=await col.doc('settings').get();if(s.exists)S=Object.assign(S,JSON.parse(s.data().value));
    const q=await col.where(F,'>=','product:').where(F,'<','product:\uf8ff').get();
    items=q.docs.map(d=>{try{return JSON.parse(d.data().value)}catch(e){return null}}).filter(Boolean).sort((a,b)=>(a.order||0)-(b.order||0));
  }catch(e){toast('تعذّر تحميل البيانات')}
  $('title').value=S.title||'';$('cur').value=S.cur||'$';$('wa').value=S.wa||'';draw();
}
function draw(){
  $('items').innerHTML=items.map(p=>`<div class="card" data-id="${esc(p.id)}">
    <div class="pv" style="${p.img?`background-image:url('${p.img}')`:''}"></div>
    <input type="file" accept="image/*" data-f="1">
    <div class="g2"><div><label>التصنيف</label><input data-k="cat" value="${esc(p.cat)}"></div><div><label>السعر</label><input data-k="price" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(p.price)}"></div></div>
    <label>اسم الصنف</label><input data-k="name" value="${esc(p.name)}">
    <label>الوصف</label><textarea data-k="desc">${esc(p.desc)}</textarea>
    <div class="acts"><button class="p" data-s="1">حفظ الصنف</button><button data-up="1">↑</button><button data-dn="1">↓</button><button class="d" data-del="1">حذف</button></div></div>`).join('');
}
const byId=id=>items.find(p=>p.id===id);
$('items').addEventListener('input',e=>{const c=e.target.closest('[data-id]'),k=e.target.dataset.k;if(!c||!k)return;
  byId(c.dataset.id)[k]=k==='price'?parseFloat(e.target.value)||0:e.target.value});
$('items').addEventListener('change',e=>{if(!e.target.dataset.f)return;const c=e.target.closest('[data-id]'),p=byId(c.dataset.id),f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    let m=900,q=.8,out;
    do{const k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',q);q-=.1;m-=100}while(out.length>700000&&q>.3);
    p.img=out;c.querySelector('.pv').style.backgroundImage=`url('${out}')`;toast('تم تجهيز الصورة — اضغط «حفظ الصنف»')};im.src=r.result};r.readAsDataURL(f)});
$('items').addEventListener('click',async e=>{const b=e.target.closest('button'),c=e.target.closest('[data-id]');if(!b||!c)return;
  const p=byId(c.dataset.id),i=items.indexOf(p);
  if(b.dataset.s){b.disabled=true;const r=await put('product:'+p.id,p);toast(r==='slow'?'سيُحفظ عند عودة الاتصال':'تم الحفظ ✓');b.disabled=false}
  else if(b.dataset.del){if(!confirm('حذف هذا الصنف نهائياً؟'))return;await col.doc('product:'+p.id).delete();items.splice(i,1);draw();toast('تم الحذف')}
  else{const j=b.dataset.up?i-1:i+1;if(j<0||j>=items.length)return;const q=items[j];[p.order,q.order]=[q.order,p.order];
    await Promise.all([put('product:'+p.id,p),put('product:'+q.id,q)]);items.sort((a,b)=>a.order-b.order);draw()}});
$('add').onclick=async()=>{const o=items.reduce((m,p)=>Math.max(m,p.order||0),0)+1,p={id:'p'+Date.now(),order:o,img:'',cat:'',name:'صنف جديد',desc:'',price:0};
  items.push(p);draw();await put('product:'+p.id,p);toast('أُضيف الصنف — عدّل بياناته ثم احفظ');scrollTo(0,document.body.scrollHeight)};
$('sset').onclick=async()=>{S={title:$('title').value,cur:$('cur').value||'$',wa:$('wa').value.replace(/\D/g,'')};
